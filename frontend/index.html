<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering AI Verification</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#18212b;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 20px 64px}header{padding:28px 0 22px}h1{font-size:30px;letter-spacing:-.03em;margin:0 0 8px}.sub{color:#64707d;font-size:15px}.card{background:#fff;border:1px solid #e2e6ea;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 8px 28px rgba(24,33,43,.04)}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#71808e;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choice{border:1px solid #d6dce2;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.choice.active{border-color:#18212b;background:#18212b;color:#fff}.choice:disabled{opacity:.4;cursor:not-allowed}.selectline{display:flex;justify-content:space-between;align-items:center}.verifier{margin-top:10px;color:#5d6975;font-size:13px}.example{color:#52616e;background:#f5f7f9;border:1px solid #e2e6ea;border-radius:10px;padding:9px 12px;cursor:pointer}.task{width:100%;min-height:150px;border:1px solid #d7dde3;border-radius:12px;padding:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.run{margin-top:14px;width:100%;padding:13px;border:0;border-radius:11px;background:#18212b;color:white;font-weight:700;cursor:pointer}.run:disabled{opacity:.45}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.stage{border:1px solid #e1e5e9;border-radius:10px;padding:12px}.stage b{font-size:13px}.status{display:block;margin-top:6px;color:#7a8792;font-size:12px}.done{color:#227a50}.fail{color:#a33c3c}.live{color:#8b6500}.resultgrid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.artifact{white-space:pre-wrap;overflow:auto;max-height:380px;background:#0f1419;color:#e8edf2;padding:16px;border-radius:10px;font:12px/1.5 ui-monospace,monospace}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f2;padding:9px 0;font-size:13px}.attempt{border-top:1px solid #edf0f2;padding:14px 0}.attempt summary{cursor:pointer;font-weight:650}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef2f5;font-size:11px}.ok{background:#e7f5ee;color:#227a50}.bad{background:#faeaea;color:#a33c3c}.muted{color:#71808e}.error{color:#a33c3c}.hidden{display:none}@media(max-width:760px){.grid,.resultgrid{grid-template-columns:1fr}.pipeline{grid-template-columns:1fr 1fr}.wrap{padding:18px 14px 40px}h1{font-size:25px}}
</style></head><body><div class="wrap">
<header><div class="eyebrow">Public Technical Demonstrator</div><h1>Engineering AI Verification</h1><div class="sub">Bring your model. Bring your verifier. We run the engineering loop.</div></header>
<section class="card"><div class="grid">
<div><div class="eyebrow">Model</div><div class="choices" id="models"><button class="choice active" data-model="gpt">GPT</button><button class="choice" data-model="gemini">Gemini</button></div></div>
<div><div class="eyebrow">Engineering domain</div><div class="choices" id="domains"><button class="choice active" data-domain="rtl">RTL</button><button class="choice" data-domain="ode">ODE</button><button class="choice" data-domain="logic">Logic</button></div><div id="verifier" class="verifier">Verifier: Verilator + Yosys</div></div></div>
<div style="margin-top:18px"><div class="selectline"><div class="eyebrow">Task / specification</div><button class="example" id="example">Load Example</button></div><textarea id="task" class="task"></textarea><button id="run" class="run">RUN ENGINEERING LOOP</button></div></section>
<section id="progress" class="card hidden"><div class="eyebrow">Execution</div><div class="pipeline" id="pipeline"></div><div id="live" class="muted" style="margin-top:12px"></div></section>
<section id="results" class="hidden"></section>
</div><script>
const examples={rtl:"Create a synthesizable 4-bit counter with clk, reset and enable.",ode:"Solve y'(x) + y(x) = 0 with y(0) = 2.",logic:"Determine whether x >= 0, y >= 0, x + y <= 10 and x = 6, y = 5 are simultaneously satisfiable."};
const verifier={rtl:"Verilator + Yosys",ode:"SymPy",logic:"Z3 / SMT"}; let domain="rtl",models=["gpt"],rid=null;
const $=id=>document.getElementById(id); const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init(){ $("task").value=examples.rtl; try{const mr=await fetch("/api/models"); const md=await mr.json(); document.querySelectorAll("[data-model]").forEach(b=>{const a=md.models.find(x=>x.id===b.dataset.model)?.available; b.disabled=!a; if(!a)b.classList.remove("active")}); models=[...document.querySelectorAll("[data-model].active")].map(x=>x.dataset.model); if(!models.length){const first=[...document.querySelectorAll("[data-model]")].find(x=>!x.disabled); if(first){first.classList.add("active");models=[first.dataset.model]}}}catch(e){} document.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>{b.classList.toggle("active");models=[...document.querySelectorAll("[data-model].active")].map(x=>x.dataset.model)});document.querySelectorAll("[data-domain]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-domain]").forEach(x=>x.classList.remove("active"));b.classList.add("active");domain=b.dataset.domain;$("verifier").textContent="Verifier: "+verifier[domain];$("task").value=examples[domain]});$("example").onclick=()=>$("task").value=examples[domain];$("run").onclick=start}
function renderPipeline(){ $("pipeline").innerHTML=["GENERATE","VERIFY","DIAGNOSE","REPAIR","RE-VERIFY"].map((x,i)=>`<div class="stage"><b>${x}</b><span id="p${i}" class="status">Waiting</span></div>`).join("")}
function stage(name,status){let map={generate:0,verify:1,diagnose:2,repair:3,verified:4};if(map[name]!==undefined){$("p"+map[name]).textContent=status==="running"?"Running":"Complete";$("p"+map[name]).className="status "+(status==="running"?"live":"done")}}
async function start(){if(!models.length)return alert("Select at least one model.");$("run").disabled=true;$("progress").classList.remove("hidden");$("results").classList.add("hidden");renderPipeline();$("live").textContent="Starting…";let r=await fetch("/api/runs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({domain,models,task:$("task").value,max_attempts:3})});let d=await r.json();rid=d.run_id;poll()}
async function poll(){let r=await fetch("/api/runs/"+rid);let d=await r.json();(d.events||[]).forEach(e=>{if(e.type==="stage"){stage(e.stage,e.status);$("live").textContent=(e.model||"")+" · "+e.stage}else if(e.type==="model_error"){$("live").innerHTML+=`<div class="error">${esc(e.model)}: ${esc(e.message)}</div>`}});if(d.status==="complete"){renderResults(d.results);$("run").disabled=false}else setTimeout(poll,450)}
function renderResults(results){let html='<section class="card"><div class="eyebrow">Verified result + evidence + trajectory + evaluation</div>';for(const [m,t] of Object.entries(results)){if(t.error){html+=`<div class="attempt"><h3>${esc(m.toUpperCase())} <span class="pill bad">ERROR</span></h3><div class="error">${esc(t.error)}</div></div>`;continue}let ok=t.final_status==="VERIFIED";html+=`<div class="attempt"><div class="selectline"><h2 style="margin:4px 0">${esc(m.toUpperCase())} <span class="pill ${ok?"ok":"bad"}">${ok?"VERIFIED":"NOT VERIFIED"}</span></h2><span class="muted">${t.evaluation.attempts} attempt(s)</span></div><div class="resultgrid"><div><div class="eyebrow">Final artifact</div><pre class="artifact">${esc(t.final_artifact||t.attempts.at(-1)?.generated_artifact||"")}</pre></div><div><div class="eyebrow">Evaluation</div>${metric("First pass",t.evaluation.first_pass_success)}${metric("Final success",t.evaluation.final_success)}${metric("Repair success",t.evaluation.repair_success)}${metric("Latency",t.evaluation.total_latency_ms+" ms")}<div class="eyebrow" style="margin-top:16px">Failure classes</div><div class="muted">${esc(JSON.stringify(t.evaluation.failure_classes||{}))}</div><a href="/api/runs/${rid}/export/${m}">Export trajectory JSON</a></div></div><details style="margin-top:14px"><summary>Trajectory · ${t.attempts.length} attempt(s)</summary>${t.attempts.map(a=>`<div class="attempt"><b>Attempt ${a.attempt_id}</b> <span class="pill ${a.verification.status==="PASS"?"ok":"bad"}">${a.verification.status}</span><div class="muted">${esc(a.verification.failure_class||"verified")}</div><p>${esc(a.verification.diagnostics||JSON.stringify(a.verification.evidence||{}))}</p><details><summary>Artifact</summary><pre class="artifact">${esc(a.generated_artifact)}</pre></details></div>`).join("")}</details></div>`}html+='</section>';$("results").innerHTML=html;$("results").classList.remove("hidden")}
function metric(k,v){return `<div class="metric"><span>${k}</span><b>${esc(v)}</b></div>`}
init();
</script></body></html>
